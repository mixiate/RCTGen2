[package]
name = "make-vehicle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
glam = "0.33.3"
openrct2 = { path = "../openrct2" }
rayon = "1.12.0"
rct = { path = "../rct" }
renderer = { path = "../renderer" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
