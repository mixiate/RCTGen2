name: clang-format Check
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  formatting-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format check
        uses: jidicula/clang-format-action@v4.18.0
        with:
          include-regex: .*\.json$
