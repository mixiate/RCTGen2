[package]
name = "make-track"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
glam = "0.33.2"
heapless = { version = "0.9.3", features = ["serde"] }
openrct2 = { path = "../openrct2" }
rayon = "1.12.0"
rct = { path = "../rct" }
renderer = { path = "../renderer" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
