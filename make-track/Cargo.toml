[package]
name = "make-track"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
glam = "0.33.3"
heapless = { version = "0.9.3", features = ["serde"] }
indexmap = { version = "2.14.0", features = ["serde"] }
openrct2 = { path = "../openrct2" }
rayon = "1.12.0"
rct = { path = "../rct" }
renderer = { path = "../renderer" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.21.0"
strum = { version = "0.28.0", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
